{% extends 'vita/base.html' %}

{% block content %}
<main>
  <section class="auth_page">
    <div class="container">
      <div class="auth_wrapper">
        <div class="auth_heading">
          <p class="section_subtitle">Проверьте почту</p>
          <h1>Если аккаунт существует, письмо отправлено</h1>
          <p>
            Если указанный адрес связан с активным аккаунтом VitaHub,
            на него придёт письмо со ссылкой для сброса пароля.
            Проверьте также папку «Спам».
          </p>
        </div>

        <div class="auth_register">
          <a href="{% url 'login' %}">Вернуться ко входу</a>
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock %}
