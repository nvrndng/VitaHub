<header class="header">

  <div class="container header_inner">

    <div class="logo">
      <a href="{% url 'home' %}">VitaHub</a>
    </div>

    <nav class="nav">
      <a href="{% url 'home' %}">Главная</a>
      <a href="{% url 'articles' %}">Статьи</a>
      <a href="{% url 'forum' %}">Форум</a>
      <a href="{% url 'specialists' %}">Консультации</a>

    </nav>


    <div class="auth">

      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="auth_login">{{ user.first_name|default:user.username }}</a>

        <a href="{% url 'logout' %}" class="auth_register">Выйти</a>

      {% else %}

        <a href="{% url 'login' %}" class="auth_login">Войти</a>

        <a href="{% url 'register' %}" class="auth_register">Регистрация</a>

      {% endif %}
    </div>


  </div>

</header>
