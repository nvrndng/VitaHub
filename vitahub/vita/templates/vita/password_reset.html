{% extends 'vita/base.html' %}

{% block content %}
<main>
  <section class="auth_page">
    <div class="container">
      <div class="auth_wrapper">
        <div class="auth_heading">
          <p class="section_subtitle">Личный кабинет</p>
          <h1>Восстановление пароля</h1>
          <p>Укажите email, с которым вы регистрировались на VitaHub.</p>
        </div>

        <form class="auth_form" method="post">
          {% csrf_token %}

          {% if form.errors %}
            <div class="form_errors">
              Проверьте правильность введённого email.
            </div>
          {% endif %}

          <div class="auth_form_group">
            <label for="id_email">Email</label>
            <input
              type="email"
              name="email"
              id="id_email"
              placeholder="Введите email"
              autocomplete="email"
              required
            >
          </div>

          <button type="submit" class="section_button auth_submit">
            Отправить ссылку
          </button>

          <div class="auth_register">
            <a href="{% url 'login' %}">Вернуться ко входу</a>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
{% endblock %}
