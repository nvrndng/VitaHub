{% extends 'vita/base.html' %}

{% block content %}
<main>
  <section class="auth_page">
    <div class="container">
      <div class="auth_wrapper">
        <div class="auth_heading">
          <p class="section_subtitle">Готово</p>
          <h1>Пароль изменён</h1>
          <p>
            Новый пароль сохранён. Теперь вы можете войти
            в свой аккаунт VitaHub.
          </p>
        </div>

        <a href="{% url 'login' %}" class="section_button auth_submit">
          Войти в аккаунт
        </a>
      </div>
    </div>
  </section>
</main>
{% endblock %}
