{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        VitaHub — портал о здоровье
        {% endblock %}
    </title>
    <meta name="theme-color" content="#4f8f7b">
    <meta name="description" content="{% block meta_description %}VitaHub — статьи о здоровье, специалисты, форум и товары для заботы о себе.{% endblock %}">
    <link rel="stylesheet" href="{% static 'vita/style.css' %}">
</head>
<body>

    {% include 'vita/navbar.html' %}

    {% block content %}

    {% endblock %}

    <footer class="site_footer">
        <div class="container site_footer_inner">
            <p class="site_footer_copyright">
                © 2026 VitaHub. Все права защищены.
            </p>

            <a class="site_footer_link" href="{% url 'contacts' %}">
                Контакты
            </a>
        </div>
    </footer>

</body>
</html>
